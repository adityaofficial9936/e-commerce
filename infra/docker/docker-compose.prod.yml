version: '3.8'

services:
  # ==========================================
  # Database: PostgreSQL 16
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_prod_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_prod}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecommerce} -d ${POSTGRES_DB:-ecommerce_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-prod-net

  # ==========================================
  # Cache & Queue Broker: Redis 7
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: ecommerce-prod-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-secure_redis_pwd_2026}"]
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secure_redis_pwd_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-prod-net

  # ==========================================
  # Search Engine: Meilisearch v1.7
  # ==========================================
  meilisearch:
    image: getmeili/meilisearch:v1.7
    container_name: ecommerce-prod-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-master_key_production_vault_99}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch_prod_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-prod-net

  # ==========================================
  # Object Storage: MinIO S3
  # ==========================================
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: ecommerce-prod-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minio_super_secret_key_2026}
    volumes:
      - minio_prod_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-prod-net

  # ==========================================
  # Backend API: NestJS Modular Monolith
  # ==========================================
  api:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.api
    container_name: ecommerce-prod-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD:-secure_prod_password_2026}@postgres:5432/${POSTGRES_DB:-ecommerce_prod}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-secure_redis_pwd_2026}
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: ${MEILI_MASTER_KEY:-master_key_production_vault_99}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio_admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minio_super_secret_key_2026}
      S3_BUCKET: ${S3_BUCKET:-ecommerce-media}
      JWT_SECRET: ${JWT_SECRET:-production_ultra_secure_jwt_secret_salt_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-production_ultra_secure_refresh_secret_salt_2026}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks:
      - ecommerce-prod-net

  # ==========================================
  # Storefront: Next.js Web App
  # ==========================================
  web:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.web
    container_name: ecommerce-prod-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://api:4000/v1
    depends_on:
      - api
    networks:
      - ecommerce-prod-net

  # ==========================================
  # Admin Console: Next.js Operations Panel
  # ==========================================
  admin:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.admin
    container_name: ecommerce-prod-admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: http://api:4000/v1
    depends_on:
      - api
    networks:
      - ecommerce-prod-net

  # ==========================================
  # Gateway / Reverse Proxy: Nginx
  # ==========================================
  nginx:
    image: nginx:1.25-alpine
    container_name: ecommerce-prod-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
      - admin
    networks:
      - ecommerce-prod-net

networks:
  ecommerce-prod-net:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  meilisearch_prod_data:
  minio_prod_data:
